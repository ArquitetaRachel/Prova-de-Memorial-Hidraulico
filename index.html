<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memoriais</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="pagina-inicial">

        <section class="card">

            <h1>Memorial 1</h1>

            <p class="descricao">
                Digite o nome dos integrantes da dupla para começar.
            </p>

            <form id="form-dupla">

                <div class="campo">
                    <label for="aluno1">Aluno 1</label>
                    <input type="text" id="aluno1" name="aluno1" placeholder="Digite o nome" required>
                </div>

                <div class="campo">
                    <label for="aluno2">Aluno 2</label>
                    <input type="text" id="aluno2" name="aluno2" placeholder="Digite o nome" required>
                </div>

                <button type="submit">
                    Começar Memorial
                </button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
