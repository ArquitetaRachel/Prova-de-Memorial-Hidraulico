<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar Memorial</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="pagina-inicial">

        <section class="card">

            <h1>Finalizar Memorial</h1>

            <p class="descricao">
                Revise seu trabalho antes de enviar.
            </p>


            <div id="resumo-dupla"></div>


            <div class="campo">

                <label for="pokemon1">
                    Pokémon 1
                </label>

                <input
                    type="text"
                    id="pokemon1"
                    placeholder="Digite o nome do Pokémon"
                >

            </div>


            <div class="campo">

                <label for="pokemon2">
                    Pokémon 2
                </label>

                <input
                    type="text"
                    id="pokemon2"
                    placeholder="Digite o nome do Pokémon"
                >

            </div>


            <button id="botao-enviar">

                Enviar Memorial

            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
